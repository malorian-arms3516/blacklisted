{% extends "base.html" %}

{% block title %}Blacklist Archive — Authorized Access{% endblock %}

{% block content %}

<div class="section-label">Authorized Access Only</div>

<div class="form-panel" style="max-width: 400px; margin: 0 auto;">
  <form method="POST" action="/login">
    <div class="form-group">
      <label>Agent Identifier</label>
      <input type="text" name="username" placeholder="USERNAME" required autofocus>
    </div>
    <div class="form-group" style="margin-top: 15px;">
      <label>Security Key</label>
      <input type="password" name="password" placeholder="PASSWORD" required>
    </div>
    <div class="form-actions" style="justify-content: center; margin-top: 30px;">
      <button type="submit" class="btn-primary" style="width: 100%;">VALIDATE CREDENTIALS</button>
    </div>
  </form>
</div>

<div style="text-align: center; margin-top: 20px; color: var(--text-muted); font-size: 10px; letter-spacing: 1px;">
  UNAUTHORIZED ACCESS TO THIS TERMINAL IS A FEDERAL OFFENSE.
</div>

{% endblock %}
